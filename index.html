    @font-face {
      font-family: 'SpaceMonoCustom';
      src: url('./fonts/SpaceMono-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #000;
      --text: #fff;
      --muted: #d5d5d5;
      --soft: #a6a6a6;
      --hover: #8d8d8d;
      --sidebar-left: 34px;
      --sidebar-top: 52px;
      --sidebar-width: 230px;
      --content-left-gap: 78px;
      --content-top: 54px;
      --content-right: 44px;
      --grid-gap-x: 120px;
      --grid-gap-y: 92px;
      --title-size: 18px;
      --detail-title: 28px;
      --logo-width: 112px;
      --detail-max: 1360px;
      --gallery-scale: 1;
      --w-1: calc(605px * var(--gallery-scale));
      --w-2: calc(583px * var(--gallery-scale));
      --w-3: calc(463px * var(--gallery-scale));
      --w-4: calc(696px * var(--gallery-scale));
      --w-5: calc(715px * var(--gallery-scale));
      --w-6: calc(547px * var(--gallery-scale));
      --w-7: calc(607px * var(--gallery-scale));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a, button {
      color: inherit;
      text-decoration: none;
      background: transparent;
      border: 0;
      font: inherit;
    }
    a:hover, button:hover { color: var(--hover); }
    img, video { display: block; width: 100%; height: auto; }

    .page { min-height: 100vh; }
    .view { display: none; }
    .view.active { display: block; }

    .sidebar {
      position: fixed;
      top: var(--sidebar-top);
      left: var(--sidebar-left);
      width: var(--sidebar-width);
      height: calc(100vh - var(--sidebar-top) - 26px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 30;
    }
    .logo {
      display: inline-block;
      width: var(--logo-width);
      line-height: 0;
      margin-bottom: 22px;
      cursor: pointer;
    }
    .nav-group { margin-bottom: 28px; }
    .group-title, .group-link {
      display: block;
      font-size: 15px;
      line-height: 1.28;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .group-link .cn {
      display: block;
      font-size: 13px;
      line-height: 1.26;
      font-weight: 400;
    }
    .nav-list { list-style: none; }
    .nav-list li {
      margin-bottom: 3px;
      transition: margin .18s ease;
    }
    .nav-list li.active-item { margin-top: 12px; margin-bottom: 16px; }
    .nav-link {
      display: inline-block;
      font-size: 15px;
      line-height: 1.28;
      white-space: normal;
      font-weight: 600;
      cursor: pointer;
      transition: transform .18s ease, color .18s ease;
      transform-origin: left center;
    }
    .nav-link .cn {
      display: block;
      font-size: 13px;
      line-height: 1.26;
      font-weight: 400;
    }
    .nav-link.active {
      color: var(--soft);
      transform: scale(1.4);
      position: relative;
      z-index: 2;
    }
    .sidebar-footer {
      font-size: 14px;
      line-height: 1.35;
      color: var(--muted);
      padding-top: 16px;
    }

    .hero-title {
      margin-left: calc(var(--sidebar-left) + var(--sidebar-width) + var(--content-left-gap));
      padding-top: 12px;
      padding-right: var(--content-right);
      font-size: clamp(84px, 13vw, 220px);
      line-height: .88;
      letter-spacing: -.06em;
      font-weight: 700;
    }
    .content {
      margin-left: calc(var(--sidebar-left) + var(--sidebar-width) + var(--content-left-gap));
      padding-top: var(--content-top);
      padding-right: var(--content-right);
      padding-bottom: 80px;
    }

    .works-grid {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
      column-gap: var(--grid-gap-x);
      align-items: start;
    }
    .works-col {
      display: flex;
      flex-direction: column;
      gap: var(--grid-gap-y);
    }
    .works-col.right { padding-top: 188px; }
    .work-card {
      display: block;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .65s ease, transform .65s ease;
    }
    .work-card.in-view { opacity: 1; transform: translateY(0); }
    .work-title {
      margin: 0 0 14px;
      font-size: var(--title-size);
      color: var(--muted);
      line-height: 1.14;
    }
    .work-media { width: 100%; max-width: 100%; }
    .work-media.w-1 { width: min(var(--w-1), 100%); }
    .work-media.w-2 { width: min(var(--w-2), 100%); }
    .work-media.w-3 { width: min(var(--w-3), 100%); }
    .work-media.w-4 { width: min(var(--w-4), 100%); }
    .work-media.w-5 { width: min(var(--w-5), 100%); }
    .work-media.w-6 { width: min(var(--w-6), 100%); }
    .work-media.w-7 { width: min(var(--w-7), 100%); }

    .detail-shell { max-width: var(--detail-max); padding-right: 18px; }
    .detail-back {
      display: inline-block;
      margin-bottom: 24px;
      color: var(--muted);
      cursor: pointer;
    }
    .detail-intro {
      display: grid;
      grid-template-columns: minmax(420px, 760px) minmax(260px, 1fr);
      gap: 44px 56px;
      align-items: start;
      margin-bottom: 58px;
    }
    .detail-intro > div:last-child { padding-top: 58px; }
    .detail-heading {
      margin-bottom: 22px;
      font-size: var(--detail-title);
      line-height: 1.08;
    }
    .detail-copy {
      max-width: 520px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-line;
      font-family: 'SpaceMonoCustom', 'Space Mono', monospace;
    }
    .detail-block { margin-bottom: 58px; }
    .detail-video-placeholder { position: relative; }
    .detail-video-label {
      position: absolute;
      left: 20px;
      bottom: 18px;
      padding: 8px 12px;
      font-size: 13px;
      color: #fff;
      background: rgba(0,0,0,.62);
      border: 1px solid rgba(255,255,255,.14);
    }
    .detail-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .detail-stack { display: grid; gap: 16px; }

    .allprojects-heading {
      margin-bottom: 26px;
      font-size: 28px;
      line-height: 1.08;
    }
    .allprojects-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px 18px;
    }
    .video-meta {
      margin-top: 10px;
      color: var(--muted);
      line-height: 1.28;
      font-size: 14px;
    }
    .video-meta .cn {
      display: block;
      font-size: 12px;
      line-height: 1.24;
      color: var(--soft);
    }
    .video-poster {
      width: 100%;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      border: 1px solid rgba(255,255,255,.08);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      padding: 0;
      appearance: none;
    }
    .video-poster img,
    .video-poster-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #000;
    }
    .video-poster img { color: transparent; font-size: 0; line-height: 0; }
    .video-poster::after {
      content: 'Play video';
      position: absolute;
      font-size: 13px;
      letter-spacing: .02em;
      color: var(--muted);
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.32);
      z-index: 2;
    }

    .mobile-header { display: none; }

    @media (max-width: 1320px) {
      :root {
        --sidebar-left: 24px;
        --sidebar-width: 210px;
        --content-left-gap: 54px;
        --grid-gap-x: 68px;

    @media (max-width: 1100px) {

      .mobile-toggle { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
      .mobile-menu { display: none; padding-top: 14px; }

        padding: 22px 18px 28px;

      .mobile-menu-close { display: inline-block; margin-bottom: 20px; cursor: pointer; }
      .hero-title {
        margin-left: 0;
        padding: 8px 18px 10px;
        font-size: clamp(56px, 16vw, 110px);
      }
      .content { margin-left: 0; padding: 18px 18px 36px; }
      .works-grid { display: flex; flex-direction: column; gap: 34px; }
      .works-col { display: contents; }
      .works-col.right { padding-top: 0; }
      .work-media, .work-media.w-1, .work-media.w-2, .work-media.w-3, .work-media.w-4, .work-media.w-5, .work-media.w-6, .work-media.w-7 { width: 100%; }
      .detail-intro { grid-template-columns: 1fr; gap: 22px; margin-bottom: 34px; }
      .detail-intro > div:last-child { padding-top: 0; }
      .detail-two-col { grid-template-columns: 1fr; }
      .allprojects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }
    }
  </style>

      { title: 'Angela Chang | "Muggle"', cn: '张韶涵 | 「麻瓜」', video: 'https://res.cloudinary.com/dgbimi7vj/video/upload/v1774683099/%E5%BC%A0%E9%9F%B6%E6%B6%B5_%E9%BA%BB%E7%93%9C_%E9%9F%B3%E4%B9%90%E5%89%A7%E6%83%85%E7%9F%AD%E7%89%87-%E9%9F%B3%E4%B9%90-%E5%A3%B0%E9%9F%B3-MV%E8%A7%86%E9%A2%91-%E6%96%B0%E7%89%87%E5%9C%BA_1_dm3nvz.mp4' }
    ];

    const homeView = document.getElementById('homeView');
    const detailView = document.getElementById('detailView');
    const allProjectsView = document.getElementById('allProjectsView');
    const detailShell = document.getElementById('detailShell');
    const allProjectsShell = document.getElementById('allProjectsShell');
    const heroTitle = document.getElementById('heroTitle');
    const desktopNavMount = document.getElementById('desktopNavMount');
    const mobileNavMount = document.getElementById('mobileNavMount');
    const homeLeft = document.getElementById('homeLeft');
    const homeRight = document.getElementById('homeRight');
    const mobileToggle = document.getElementById('mobileToggle');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuClose = document.getElementById('mobileMenuClose');

    function navBlock(title, items) {
      return `<div class="nav-group"><div class="group-title">${title}</div><ul class="nav-list">${items.map(item => `<li data-nav-item="${item.id}"><a class="nav-link js-project-link" data-project="${item.id}">${item.en}${item.cn ? `<br><span class="cn">${item.cn}</span>` : ''}</a></li>`).join('')}</ul></div>`;
    }

    function renderNav() {
      return `
        <div class="nav-group"><div class="group-title">BuffTool | AIGC 工具</div></div>
        ${navBlock('New', NAV_NEW)}
        ${navBlock('Past', NAV_PAST)}
        <div class="nav-group"><a class="group-link js-allprojects">All Projects</a><a class="group-link" href="#">Team members<br><span class="cn">团队成员</span></a></div>
        <div class="nav-group"><a class="group-link" href="#">Info<br><span class="cn">关于我们</span></a><a class="group-link" href="https://www.instagram.com/mori_merceies/" target="_blank" rel="noreferrer">Instagram</a><a class="group-link" href="https://www.xiaohongshu.com/user/profile/5a96254611be104dda4a1ee6" target="_blank" rel="noreferrer">Red Book<br><span class="cn">小红书</span></a><a class="group-link" href="#">TikTok<br><span class="cn">抖音</span></a><a class="group-link" href="https://www.xinpianchang.com/u10097145?channel=copyLink&from=webShare" target="_blank" rel="noreferrer">Xinpianchang<br><span class="cn">新片场</span></a></div>
      `;
    }

    function renderHomeCard(id) {
      const item = GALLERY[id];
      return `<article class="work-card" id="${id}"><a class="js-project-link" data-project="${id}"><h2 class="work-title">${item.title}</h2><div class="work-media ${item.cls}"><img loading="lazy" decoding="async" src="${item.src}" alt="${item.title}"></div></a></article>`;
    }

    function setActiveLink(projectId) {
      document.querySelectorAll('[data-nav-item]').forEach(li => li.classList.toggle('active-item', li.dataset.navItem === projectId));
      document.querySelectorAll('.nav-link.js-project-link').forEach(link => link.classList.toggle('active', link.dataset.project === projectId));
    }

    function mediaSections(stack, singleColumn = false) {
      if (!stack || !stack.length) return '';
      if (singleColumn) return stack.map(src => `<section class="detail-block detail-full"><img loading="lazy" decoding="async" src="${src}" alt=""></section>`).join('');
      const parts = [];
      for (let i = 0; i < stack.length; ) {
        if (i + 1 < stack.length) {
          parts.push(`<section class="detail-block detail-two-col"><img loading="lazy" decoding="async" src="${stack[i]}" alt=""><img loading="lazy" decoding="async" src="${stack[i+1]}" alt=""></section>`);
          i += 2;
        } else {
          parts.push(`<section class="detail-block detail-full"><img loading="lazy" decoding="async" src="${stack[i]}" alt=""></section>`);
          i += 1;
        }
      }
      return parts.join('');
    }

    function renderDetailPage(project) {
      const copy = project.textFile ? `<div class="detail-copy" data-text-file="${project.textFile}">Loading text...</div>` : `<div class="detail-copy">${project.intro || ''}</div>`;
      const stack = project.randomize ? [...project.stack].sort(() => Math.random() - 0.5) : (project.stack || []);
      return `
        <a class="detail-back js-back">← Back to gallery</a>
        <section class="detail-intro detail-block">
          <div><h1 class="detail-heading">${project.title}</h1><div class="detail-hero"><img loading="lazy" decoding="async" src="${project.hero}" alt="${project.title}"></div></div>
          ${copy}
        </section>
        ${project.video1 ? `<section class="detail-block detail-video-placeholder"><video src="${project.video1}" controls playsinline preload="metadata"></video><div class="detail-video-label">Campaign video</div></section>` : ''}
        ${project.video2 ? `<section class="detail-block detail-video-placeholder"><video src="${project.video2}" controls playsinline preload="metadata"></video><div class="detail-video-label">Campaign video</div></section>` : ''}
        ${mediaSections(stack, project.singleColumn)}
      `;
    }

    function renderAllProjectsPage() {
      return `
        <a class="detail-back js-back-home">← Back to gallery</a>
        <h1 class="allprojects-heading">All Projects</h1>
        <section class="allprojects-grid">${ALL_PROJECTS.map(item => `
          <article class="video-card">
            <div class="video-thumb" data-video-card>
              <button class="video-poster" data-video-src="${item.video}" data-poster-time="${item.posterTime ?? ''}" aria-label="Play ${item.title}">
                <div class="video-poster-fallback" aria-hidden="true"></div>
              </button>
            </div>
            <div class="video-meta">${item.title}<span class="cn">${item.cn}</span></div>
          </article>`).join('')}</section>
      `;
    }

    function wireTextFile(container) {
      const t = container.querySelector('[data-text-file]');
      if (!t) return;
      fetch(t.dataset.textFile).then(r => r.ok ? r.text() : Promise.reject()).then(text => { t.textContent = text; }).catch(() => { t.textContent = 'Text unavailable.'; });
    }

    function stopAndClearVideos(container) {
      if (!container) return;
      container.querySelectorAll('video').forEach(video => {
        try { video.pause(); } catch (e) {}
        try { video.removeAttribute('src'); video.load(); } catch (e) {}
      });
      if (container === allProjectsShell) container.innerHTML = '';
    }

    function createPoster(videoUrl, timeSec) {
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.crossOrigin = 'anonymous';
        video.muted = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.src = videoUrl;
        video.addEventListener('loadedmetadata', () => {
          const duration = Number.isFinite(video.duration) ? video.duration : 0;
          const target = Math.max(0, Math.min(timeSec || 0, Math.max(0, duration - .2)));
          video.currentTime = target;
        }, { once: true });
        video.addEventListener('seeked', () => {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/webp', .82));
          } catch (err) { reject(err); }
        }, { once: true });
        video.addEventListener('error', reject, { once: true });
      });
    }

    function bindAllProjectsVideos() {
      allProjectsShell.querySelectorAll('[data-video-src]').forEach(button => {
        const time = Number(button.dataset.posterTime);
        if (Number.isFinite(time)) {
          createPoster(button.dataset.videoSrc, time).then((poster) => {
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.decoding = 'async';
            img.alt = '';
            img.src = poster;
            button.prepend(img);
          }).catch(() => {});
        }
        button.addEventListener('click', () => {
          const wrapper = button.closest('[data-video-card]');
          if (!wrapper) return;
          wrapper.innerHTML = `<video src="${button.dataset.videoSrc}" controls playsinline preload="none" autoplay></video>`;
        }, { once: true });
      });
    }

    function closeMobileMenu() {
      if (!mobileMenu) return;
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
      if (mobileToggle) {
        mobileToggle.setAttribute('aria-expanded', 'false');
        mobileToggle.textContent = 'Menu';
      }
    }

    function showHome() {
      stopAndClearVideos(detailShell);
      stopAndClearVideos(allProjectsShell);
      detailView.classList.remove('active');
      allProjectsView.classList.remove('active');
      homeView.classList.add('active');
      heroTitle.style.display = 'block';
      setActiveLink('');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      closeMobileMenu();
    }

    function openProject(id) {
      const project = PROJECTS[id];
      if (!project) return;
      stopAndClearVideos(detailShell);
      stopAndClearVideos(allProjectsShell);
      heroTitle.style.display = 'none';
      homeView.classList.remove('active');
      allProjectsView.classList.remove('active');
      detailView.classList.add('active');
      detailShell.innerHTML = renderDetailPage(project);
      wireTextFile(detailShell);
      setActiveLink(id);
      const back = detailShell.querySelector('.js-back');
      if (back) back.addEventListener('click', showHome);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      closeMobileMenu();
    }

    function openAllProjects() {
      stopAndClearVideos(detailShell);
      stopAndClearVideos(allProjectsShell);
      heroTitle.style.display = 'none';
      homeView.classList.remove('active');
      detailView.classList.remove('active');
      allProjectsView.classList.add('active');
      allProjectsShell.innerHTML = renderAllProjectsPage();
      bindAllProjectsVideos();
      setActiveLink('');
      const back = allProjectsShell.querySelector('.js-back-home');
      if (back) back.addEventListener('click', showHome);
      window.scrollTo({ top: 0, behavior: 'smooth' });
      closeMobileMenu();
    }

    function mount() {
      desktopNavMount.innerHTML = renderNav();
      mobileNavMount.innerHTML = renderNav();
      const homeLeftOrder = ['project-18','project-17','project-16','project-15','project-0','project-14','project-1','project-3','project-6','project-12','project-2','project-5'];
      const homeRightOrder = ['project-7','project-11','project-4','project-10','project-8','project-13'];
      homeLeft.innerHTML = homeLeftOrder.map(renderHomeCard).join('');
      homeRight.innerHTML = homeRightOrder.map(renderHomeCard).join('');

      document.querySelectorAll('.js-project-link').forEach(link => link.addEventListener('click', (e) => {
        e.preventDefault();
        openProject(link.dataset.project);
      }));
      document.querySelectorAll('.js-home').forEach(link => link.addEventListener('click', (e) => {
        e.preventDefault();
        showHome();
      }));
      document.querySelectorAll('.js-allprojects').forEach(link => link.addEventListener('click', (e) => {
        e.preventDefault();
        openAllProjects();
      }));

      if (mobileToggle && mobileMenu) {
        mobileToggle.addEventListener('click', () => {
          const open = mobileMenu.classList.toggle('open');
          mobileToggle.setAttribute('aria-expanded', String(open));
          mobileToggle.textContent = open ? 'Close' : 'Menu';
          document.body.style.overflow = open ? 'hidden' : '';
        });
      }
      if (mobileMenuClose) mobileMenuClose.addEventListener('click', closeMobileMenu);

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('in-view'); });
      }, { threshold: .08, rootMargin: '0px 0px -8% 0px' });
      document.querySelectorAll('.work-card').forEach(card => observer.observe(card));
    }

    mount();
  </script>
</body>
</html>
